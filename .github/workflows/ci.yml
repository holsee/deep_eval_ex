name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ['1.19.5']
        otp: ['28.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      # Fails on retired packages and security advisories in mix.lock.
      - name: Audit dependencies
        run: mix hex.audit

      - name: Check formatting
        run: mix format --check-formatted

      # req_llm is optional: DeepEvalEx must also compile without it.
      - name: Compile without optional dependencies
        run: mix compile --no-optional-deps --warnings-as-errors --force

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors --force

      - name: Run Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test --warnings-as-errors

      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Create PLT directory
        run: mkdir -p priv/plts

      - name: Run Dialyzer
        run: mix dialyzer

      # ex_doc is a dev-only dependency.
      - name: Build docs with warnings as errors
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev
